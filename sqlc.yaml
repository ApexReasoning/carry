version: "2"
sql:
    - engine: postgresql
      schema: internal/postgres/migrations
      queries: internal/postgres/queries
      gen:
          go:
              package: dbsqlc
              out: internal/postgres/dbsqlc
              sql_package: pgx/v5
              emit_pointers_for_null_types: true
              overrides:
                  - db_type: uuid
                    go_type: string
