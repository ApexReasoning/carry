        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
components:
  headers:
    NoStore:
      description: Authenticated responses must not be stored by any cache
      schema:
        type: string
        const: no-store
  securitySchemes:
    memberCliCredential:
      type: http
      scheme: bearer
      description: >-
        A Browser-approved carry_cli_ User credential; never a Machine
        certificate or Browser Session
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-carry_session
  parameters:
    OAuthState:
      name: state
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    OAuthCode:
      name: code
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    OAuthError:
      name: error
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
    MachineConnectionRequestID:
      name: requestID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MachineID:
      name: machineID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpaceID:
      name: spaceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkID:
      name: workID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewID:
      name: reviewID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    CliPollProof:
      name: X-Carry-CLI-Poll
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    BeforeConversationMessage:
      name: before
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AfterConversationMessage:
      name: after
      in: query
      required: false
      schema:
        type: string
        format: uuid
    BeforeWork:
      name: before
      in: query
      required: false
      schema:
        type: string
        format: uuid
    BeforeWorkMessage:
      name: before
      in: query
      required: false
      schema:
        type: string
        format: uuid
    NeedsYou:
      name: needs_you
      in: query
      required: false
      schema:
        type: boolean
        default: false
  responses:
    Error:
      description: Request rejected
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    APIError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    SpaceCreationConflict:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        slug:
          type: string
        suggested_slug:
          type: string
        suggested_suffix:
          type: integer
          minimum: 2
          maximum: 9999
    BegunCliLogin:
      type: object
      additionalProperties: false
      required:
        - request_id
        - user_code
        - poll_secret
        - verification_path
        - expires_at
        - interval_seconds
      properties:
        request_id:
          type: string
          format: uuid
        user_code:
          type: string
        poll_secret:
          type: string
        verification_path:
          type: string
          const: /cli-login
        expires_at:
          type: string
          format: date-time
        interval_seconds:
          type: integer
          minimum: 5
          maximum: 30
    RedeemedCliCredential:
      type: object
      additionalProperties: false
      required:
        - credential_id
        - credential
        - user_id
        - space_id
        - label
        - expires_at
      properties:
        credential_id:
          type: string
          format: uuid
        credential:
          type: string
        user_id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        label:
          type: string
        expires_at:
          type: string
          format: date-time
    CliLoginPreview:
      type: object
      additionalProperties: false
      required:
        - request_id
        - user_code
        - label
        - server
        - created_at
        - expires_at
        - approved
        - denied
        - cancelled
        - redeemed
      properties:
        request_id:
          type: string
          format: uuid
        user_code:
          type: string
        label:
          type: string
        server:
          type: string
          format: uri
        proposed_replacement_credential_id:
          type: string
          format: uuid
        approved_space_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        approved:
          type: boolean
        denied:
          type: boolean
        cancelled:
          type: boolean
        redeemed:
          type: boolean
    CliCredential:
      type: object
      additionalProperties: false
      required:
        - credential_id
        - label
        - approved_space_id
        - approved_space_name
        - created_at
        - expires_at
      properties:
        credential_id:
          type: string
          format: uuid
        label:
          type: string
        approved_space_id:
          type: string
          format: uuid
        approved_space_name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    EmailChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    IdentityMethods:
      type: object
      additionalProperties: false
      required: [methods, reauthentication_required]
      properties:
        methods:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            type: string
            enum: [email, google, github]
        reauthentication_required:
          type: boolean
    Membership:
      type: object
      additionalProperties: false
      required: [space_id, name, slug, can_manage_members, can_enroll_machines]
      properties:
        space_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          minLength: 1
          maxLength: 32
        can_manage_members:
          type: boolean
        can_enroll_machines:
          type: boolean
    User:
      type: object
      additionalProperties: false
      required: [user_id, display_name, spaces]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    SpaceMember:
      type: object
      additionalProperties: false
      required:
        [
          user_id,
          display_name,
          can_manage_members,
          can_enroll_machines,
          open_work_count,
          joined_at,
        ]
      properties:
        user_id:
