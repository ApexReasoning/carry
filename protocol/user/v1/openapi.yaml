openapi: 3.1.0
info:
  title: Carry User API
  version: 0.1.0
servers:
  - url: /
security:
  - memberToken: []
  - browserSession: []
paths:
  /v1/browser/sessions:
    post:
      operationId: createBrowserSession
      security:
        - memberToken: []
      responses:
        "204":
          description: Browser session created
        "401":
          $ref: "#/components/responses/Error"
  /v1/browser/sessions/current:
    delete:
      operationId: revokeCurrentBrowserSession
      security:
        - browserSession: []
      responses:
        "204":
          description: Browser session revoked
        "401":
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: loadCurrentMember
      responses:
        "200":
          description: Current member and Spaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/conversation/messages:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    get:
      operationId: listConversationMessages
      parameters:
        - $ref: "#/components/parameters/BeforeConversationMessage"
        - $ref: "#/components/parameters/AfterConversationMessage"
      responses:
        "200":
          description: Newest or cursor-relative private Conversation page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [messages]
                properties:
                  messages:
                    type: array
                    maxItems: 50
                    items:
                      $ref: "#/components/schemas/ConversationMessage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: sendConversationMessage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  description: After trimming, 1–16384 UTF-8 bytes
      responses:
        "200":
          description: Accepted or idempotently replayed private member message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMessage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/works:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    get:
      operationId: listWorks
      responses:
        "200":
          description: Work visible in the Space
          content:
            application/json:
              schema:
                type: object
                required: [works]
                properties:
                  works:
                    type: array
                    items:
                      $ref: "#/components/schemas/Work"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createWork
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [goal]
              properties:
                goal:
                  type: string
                  minLength: 1
                  description: After trimming, 1–2000 UTF-8 bytes
      responses:
        "200":
          description: Created or idempotently replayed Work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Work"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/works/{workID}:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
      - $ref: "#/components/parameters/WorkID"
    get:
      operationId: loadWork
      responses:
        "200":
          description: Work and its ordered member messages
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [work, messages]
                properties:
                  work:
                    $ref: "#/components/schemas/Work"
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkMessage"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/works/{workID}/messages:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
      - $ref: "#/components/parameters/WorkID"
    post:
      operationId: appendWorkMessage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  description: Non-blank and at most 61440 UTF-8 bytes
      responses:
        "200":
          description: Appended or idempotently replayed Work Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkMessage"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/works/{workID}/retry:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
      - $ref: "#/components/parameters/WorkID"
    post:
      operationId: retryWork
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Work retry requested or idempotently replayed
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    memberToken:
      type: http
      scheme: bearer
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-carry_session
  parameters:
    SpaceID:
      name: spaceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkID:
      name: workID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    BeforeConversationMessage:
      name: before
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AfterConversationMessage:
      name: after
      in: query
      required: false
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Request rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    APIError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    Membership:
      type: object
      additionalProperties: false
      required: [space_id, name, can_enroll_machines]
      properties:
        space_id:
          type: string
          format: uuid
        name:
          type: string
        can_enroll_machines:
          type: boolean
    Member:
      type: object
      additionalProperties: false
      required: [user_id, spaces]
      properties:
        user_id:
          type: string
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    ConversationMessage:
      type: object
      additionalProperties: false
      required: [message_id, author, text, created_at]
      properties:
        message_id:
          type: string
          format: uuid
        author:
          type: string
          enum: [member, carry]
        text:
          type: string
        request_id:
          type: string
          description: Present only on the authenticated member's own input
        created_work_id:
          type: string
          format: uuid
          description: Present only on a private Carry reply that created Work
        created_at:
          type: string
          format: date-time
    Work:
      type: object
      additionalProperties: false
      required:
        - work_id
        - space_id
        - goal
        - lifecycle
        - owner_user_id
        - creator_user_id
        - understanding
        - next_step
        - has_unapplied_input
        - needs_retry
        - created_at
      properties:
        work_id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        goal:
          type: string
        lifecycle:
          type: string
          enum: [open]
        owner_user_id:
          type: string
        creator_user_id:
          type: string
        understanding:
          type: string
        next_step:
          type: string
        has_unapplied_input:
          type: boolean
        needs_retry:
          type: boolean
          description: An active member must explicitly request a fresh attempt
        created_at:
          type: string
          format: date-time
    WorkMessage:
      type: object
      additionalProperties: false
      required:
        - message_id
        - work_id
        - author_user_id
        - text
        - created_at
      properties:
        message_id:
          type: string
          format: uuid
        work_id:
          type: string
          format: uuid
        author_user_id:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
