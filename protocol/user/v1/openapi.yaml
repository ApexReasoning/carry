openapi: 3.1.0
info:
  title: Carry User API
  version: 0.1.0
servers:
  - url: /
security:
  - memberToken: []
  - browserSession: []
paths:
  /v1/auth/email/challenges:
    post:
      operationId: requestEmailCode
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, email]
              properties:
                challenge_id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        "202":
          description: Email submission accepted or its outcome remains unknown
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallenge"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/email/challenges/{challengeID}/verify:
    parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: verifyEmailCode
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "204":
          description: Browser session established or exactly replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/google/start:
    post:
      operationId: startGoogleLogin
      security: []
      responses:
        "303":
          description: Redirect to the fixed Google authorization endpoint
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/google/callback:
    get:
      operationId: completeGoogleLogin
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthState"
        - $ref: "#/components/parameters/OAuthCode"
        - $ref: "#/components/parameters/OAuthError"
      responses:
        "303":
          description: >-
            Redirect to a fixed clean Carry URL after consuming the callback
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/github/start:
    post:
      operationId: startGitHubLogin
      security: []
      responses:
        "303":
          description: Redirect to the fixed GitHub authorization endpoint
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/github/callback:
    get:
      operationId: completeGitHubLogin
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthState"
        - $ref: "#/components/parameters/OAuthCode"
        - $ref: "#/components/parameters/OAuthError"
      responses:
        "303":
          description: >-
            Redirect to a fixed clean Carry URL after consuming the callback
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
  /v1/identity/methods:
    get:
      operationId: loadIdentityMethods
      security:
        - browserSession: []
      responses:
        "200":
          description: Fixed linked-method labels and recent-proof requirement
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityMethods"
        "401":
          $ref: "#/components/responses/Error"
  /v1/identity/reauthentication/email/challenges:
    post:
      operationId: requestEmailReauthenticationCode
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id]
              properties:
                challenge_id:
                  type: string
                  format: uuid
      responses:
        "202":
          description: Confirmation code submitted to the linked email method
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallenge"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/identity/reauthentication/email/challenges/{challengeID}/verify:
    parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: verifyEmailReauthenticationCode
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "204":
          description: >-
            Exact current method confirmed and Browser Session rotated
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/identity/reauthentication/google/start:
    post:
      operationId: startGoogleReauthentication
      security:
        - browserSession: []
      responses:
        "303":
          description: Redirect to Google for exact current-method confirmation
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/identity/reauthentication/github/start:
    post:
      operationId: startGitHubReauthentication
      security:
        - browserSession: []
      responses:
        "303":
          description: Redirect to GitHub for exact current-method confirmation
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/identity/methods/email/challenges:
    post:
      operationId: requestEmailLinkCode
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, email]
              properties:
                challenge_id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        "202":
          description: Candidate email proof submitted
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallenge"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/identity/methods/email/challenges/{challengeID}/verify:
    parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: verifyEmailLinkCode
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "204":
          description: Email linked and all pre-change Sessions rotated
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/identity/methods/google/start:
    post:
      operationId: startGoogleLink
      security:
        - browserSession: []
      responses:
        "303":
          description: Redirect to Google to prove the candidate method
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/identity/methods/github/start:
    post:
      operationId: startGitHubLink
      security:
        - browserSession: []
      responses:
        "303":
          description: Redirect to GitHub to prove the candidate method
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/identity/methods/{method}:
    parameters:
      - name: method
        in: path
        required: true
        schema:
          type: string
          enum: [email, google, github]
    delete:
      operationId: unlinkIdentityMethod
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Method unlinked and all pre-change Sessions rotated
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/browser/sessions/current:
    delete:
      operationId: revokeCurrentBrowserSession
      security:
        - browserSession: []
      responses:
        "204":
          description: Browser session revoked
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: loadCurrentUser
      responses:
        "200":
          description: Current User and Spaces
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
  /v1/spaces:
    post:
      operationId: createFirstSpace
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, name]
              properties:
                display_name:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: >-
            First Space and creator Membership created or exactly replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/machines/enroll:
    post:
      operationId: enrollMachine
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [space_id, display_name, public_key]
              properties:
                space_id:
                  type: string
                  format: uuid
                display_name:
                  type: string
                  minLength: 1
                public_key:
                  type: string
                  format: byte
      responses:
        "201":
          description: Machine enrolled or idempotently replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineEnrollment"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/machines/revoke:
    post:
      operationId: revokeMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [space_id, machine_id]
              properties:
                space_id:
                  type: string
                  format: uuid
                machine_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Machine revoked
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: revoked
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/conversation/messages:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    get:
      operationId: listConversationMessages
      parameters:
        - $ref: "#/components/parameters/BeforeConversationMessage"
        - $ref: "#/components/parameters/AfterConversationMessage"
      responses:
        "200":
          description: Newest or cursor-relative private Conversation page
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [messages]
                properties:
                  messages:
                    type: array
                    maxItems: 50
                    items:
                      $ref: "#/components/schemas/ConversationMessage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: sendConversationMessage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  description: After trimming, 1–16384 UTF-8 bytes
      responses:
        "200":
          description: Accepted or idempotently replayed private member message
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMessage"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/works:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    get:
      operationId: listWorks
      parameters:
        - $ref: "#/components/parameters/BeforeWork"
        - $ref: "#/components/parameters/NeedsYou"
      responses:
        "200":
          description: >-
            Newest or cursor-relative Work summaries visible in the Space;
            needs_you limits the result to current reviews or explicit retries
            owned by the authenticated member
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [works, has_earlier_works]
                properties:
                  works:
                    type: array
                    maxItems: 50
                    items:
                      $ref: "#/components/schemas/WorkSummary"
                  has_earlier_works:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createWork
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [goal]
              properties:
                goal:
                  type: string
                  minLength: 1
                  description: After trimming, 1–2000 UTF-8 bytes
      responses:
        "200":
          description: Created or idempotently replayed Work
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Work"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/works/{workID}:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
      - $ref: "#/components/parameters/WorkID"
    get:
      operationId: loadWork
      parameters:
        - $ref: "#/components/parameters/BeforeWorkMessage"
      responses:
        "200":
          description: >-
            Work and its newest or cursor-relative ordered member message page
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [work, messages, has_earlier_messages]
                properties:
                  work:
                    $ref: "#/components/schemas/Work"
                  messages:
                    type: array
                    maxItems: 50
                    description: >-
                      Ordered complete messages with at most 262144 total
                      UTF-8 text bytes
                    items:
                      $ref: "#/components/schemas/WorkMessage"
                  has_earlier_messages:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/works/{workID}/messages:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
      - $ref: "#/components/parameters/WorkID"
    post:
      operationId: appendWorkMessage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  description: Non-blank and at most 61440 UTF-8 bytes
      responses:
        "200":
          description: Appended or idempotently replayed Work Message
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkMessage"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/works/{workID}/reviews/{reviewID}/accept:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
      - $ref: "#/components/parameters/WorkID"
      - $ref: "#/components/parameters/ReviewID"
    post:
      operationId: acceptWorkReview
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: >-
            Exact current stage result accepted or idempotently replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/works/{workID}/retry:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
      - $ref: "#/components/parameters/WorkID"
    post:
      operationId: retryWork
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Work retry requested or idempotently replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/members:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    get:
      operationId: listSpaceMembers
      security:
        - browserSession: []
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bounded page of current active Space members
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [members, next_cursor]
                properties:
                  members:
                    type: array
                    maxItems: 50
                    items:
                      $ref: "#/components/schemas/SpaceMember"
                  next_cursor:
                    type: [string, "null"]
                    format: uuid
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/members/{userID}/remove:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
      - name: userID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: removeSpaceMember
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                open_work_new_owner_user_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "204":
          description: >-
            Membership revoked with Open Work transferred, or exactly replayed
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/invitations:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
    get:
      operationId: listManagedInvitations
      security:
        - browserSession: []
      responses:
        "200":
          description: Current pending invitations visible to a manager
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    maxItems: 50
                    items:
                      $ref: "#/components/schemas/ManagedInvitation"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: issueSpaceInvitation
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, can_manage_members, can_enroll_machines]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                can_manage_members:
                  type: boolean
                  default: false
                can_enroll_machines:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Invitation and initial submission prepared and observed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedInvitation"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/invitations/{invitationID}/resend:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
      - $ref: "#/components/parameters/InvitationID"
    post:
      operationId: resendSpaceInvitation
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Exact resend submission result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedInvitation"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/spaces/{spaceID}/invitations/{invitationID}/revoke:
    parameters:
      - $ref: "#/components/parameters/SpaceID"
      - $ref: "#/components/parameters/InvitationID"
    post:
      operationId: revokeSpaceInvitation
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Invitation revoked or exactly replayed
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/invitations:
    get:
      operationId: listInvitationInbox
      security:
        - browserSession: []
      responses:
        "200":
          description: Invitations for the current User's exact Email method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationInbox"
        "401":
          $ref: "#/components/responses/Error"
  /v1/invitations/{invitationID}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationID"
    post:
      operationId: acceptSpaceInvitation
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name:
                  type: string
                  maxLength: 255
      responses:
        "200":
          description: Exact Membership consequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInvitation"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
components:
  headers:
    NoStore:
      description: Authenticated responses must not be stored by any cache
      schema:
        type: string
        const: no-store
  securitySchemes:
    memberToken:
      type: http
      scheme: bearer
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-carry_session
  parameters:
    OAuthState:
      name: state
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    OAuthCode:
      name: code
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    OAuthError:
      name: error
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
    SpaceID:
      name: spaceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkID:
      name: workID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewID:
      name: reviewID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    BeforeConversationMessage:
      name: before
      in: query
      required: false
      schema:
        type: string
        format: uuid
    AfterConversationMessage:
      name: after
      in: query
      required: false
      schema:
        type: string
        format: uuid
    BeforeWork:
      name: before
      in: query
      required: false
      schema:
        type: string
        format: uuid
    BeforeWorkMessage:
      name: before
      in: query
      required: false
      schema:
        type: string
        format: uuid
    NeedsYou:
      name: needs_you
      in: query
      required: false
      schema:
        type: boolean
        default: false
  responses:
    Error:
      description: Request rejected
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    APIError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    EmailChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    IdentityMethods:
      type: object
      additionalProperties: false
      required: [methods, reauthentication_required]
      properties:
        methods:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            type: string
            enum: [email, google, github]
        reauthentication_required:
          type: boolean
    Membership:
      type: object
      additionalProperties: false
      required: [space_id, name, can_manage_members, can_enroll_machines]
      properties:
        space_id:
          type: string
          format: uuid
        name:
          type: string
        can_manage_members:
          type: boolean
        can_enroll_machines:
          type: boolean
    User:
      type: object
      additionalProperties: false
      required: [user_id, display_name, spaces]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        spaces:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    SpaceMember:
      type: object
      additionalProperties: false
      required:
        [
          user_id,
          display_name,
          can_manage_members,
          can_enroll_machines,
          open_work_count,
          joined_at,
        ]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        can_manage_members:
          type: boolean
        can_enroll_machines:
          type: boolean
        open_work_count:
          type: integer
          format: int64
          minimum: 0
        joined_at:
          type: string
          format: date-time
    InvitationSubmission:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [prepared, accepted, rejected, unknown]
    ManagedInvitation:
      type: object
      additionalProperties: false
      required:
        [
          invitation_id,
          space_id,
          recipient_email,
          can_manage_members,
          can_enroll_machines,
          created_at,
          expires_at,
          submission,
        ]
      properties:
        invitation_id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        recipient_email:
          type: string
          format: email
        can_manage_members:
          type: boolean
        can_enroll_machines:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        submission:
          $ref: "#/components/schemas/InvitationSubmission"
    RecipientInvitation:
      type: object
      additionalProperties: false
      required:
        [
          invitation_id,
          space_id,
          space_name,
          inviter_display_name,
          can_manage_members,
          can_enroll_machines,
          created_at,
          expires_at,
        ]
      properties:
        invitation_id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        space_name:
          type: string
        inviter_display_name:
          type: string
        can_manage_members:
          type: boolean
        can_enroll_machines:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    InvitationInbox:
      type: object
      additionalProperties: false
      required: [invitations, reauthentication_required]
      properties:
        invitations:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/RecipientInvitation"
        reauthentication_required:
          type: boolean
    AcceptedInvitation:
      type: object
      additionalProperties: false
      required:
        [
          invitation_id,
          space_id,
          space_name,
          can_manage_members,
          can_enroll_machines,
          already_member,
        ]
      properties:
        invitation_id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        space_name:
          type: string
        can_manage_members:
          type: boolean
        can_enroll_machines:
          type: boolean
        already_member:
          type: boolean
    MachineEnrollment:
      type: object
      additionalProperties: false
      required: [machine_id, space_id, certificate_pem]
      properties:
        machine_id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        certificate_pem:
          type: string
    ConversationMessage:
      type: object
      additionalProperties: false
      required: [message_id, author, text, created_at]
      properties:
        message_id:
          type: string
          format: uuid
        author:
          type: string
          enum: [member, carry]
        text:
          type: string
        request_id:
          type: string
          description: Present only on the authenticated member's own input
        created_work_id:
          type: string
          format: uuid
          description: Present only on a private Carry reply that created Work
        created_at:
          type: string
          format: date-time
    Work:
      type: object
      additionalProperties: false
      required:
        - work_id
        - space_id
        - goal
        - lifecycle
        - owner_user_id
        - owner_display_name
        - creator_user_id
        - creator_display_name
        - understanding
        - next_step
        - has_unapplied_input
        - needs_retry
        - needs_review
        - created_at
      properties:
        work_id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        goal:
          type: string
        lifecycle:
          type: string
          enum: [open]
        owner_user_id:
          type: string
          format: uuid
        owner_display_name:
          type: string
        creator_user_id:
          type: string
          format: uuid
        creator_display_name:
          type: string
        understanding:
          type: string
        next_step:
          type: string
        has_unapplied_input:
          type: boolean
        needs_retry:
          type: boolean
          description: An active member must explicitly request a fresh attempt
        needs_review:
          type: boolean
          description: >-
            The current stage result awaits acceptance by the Work owner
        review_id:
          type: string
          format: uuid
          description: Present only with the exact current reviewable result
        created_at:
          type: string
          format: date-time
    WorkSummary:
      type: object
      additionalProperties: false
      required:
        - work_id
        - space_id
        - goal
        - lifecycle
        - owner_user_id
        - owner_display_name
        - creator_user_id
        - creator_display_name
        - has_unapplied_input
        - needs_retry
        - needs_review
        - created_at
      properties:
        work_id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        goal:
          type: string
        lifecycle:
          type: string
          enum: [open]
        owner_user_id:
          type: string
          format: uuid
        owner_display_name:
          type: string
        creator_user_id:
          type: string
          format: uuid
        creator_display_name:
          type: string
        has_unapplied_input:
          type: boolean
        needs_retry:
          type: boolean
          description: An active member must explicitly request a fresh attempt
        needs_review:
          type: boolean
          description: >-
            The current stage result awaits acceptance by the Work owner
        created_at:
          type: string
          format: date-time
    WorkMessage:
      type: object
      additionalProperties: false
      required:
        - message_id
        - work_id
        - author_user_id
        - author_display_name
        - text
        - created_at
      properties:
        message_id:
          type: string
          format: uuid
        work_id:
          type: string
          format: uuid
        author_user_id:
          type: string
          format: uuid
        author_display_name:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time
