openapi: 3.1.0
info:
  title: Carry User API
  version: 0.1.0
servers:
  - url: /
security:
  - memberCliCredential: []
  - browserSession: []
paths:
  /v1/cli-logins:
    post:
      operationId: beginCliLogin
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, label]
              properties:
                request_id:
                  type: string
                  format: uuid
                label:
                  type: string
                  minLength: 1
                  maxLength: 128
                proposed_replacement_credential_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: >-
            Short-lived Browser approval ceremony created or exactly replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BegunCliLogin"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/cli-logins/poll:
    post:
      operationId: pollCliLogin
      security: []
      parameters:
        - $ref: "#/components/parameters/CliPollProof"
      responses:
        "200":
          description: >-
            The one final CLI credential, including exact committed replay
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemedCliCredential"
        "202":
          description: Awaiting explicit Browser decision
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/cli-logins/cancel:
    post:
      operationId: cancelCliLogin
      security: []
      parameters:
        - $ref: "#/components/parameters/CliPollProof"
      responses:
        "204":
          description: Pending or approved-unredeemed request cancelled
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /v1/cli-logins/lookup:
    post:
      operationId: lookupCliLogin
      security:
        - browserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_code]
              properties:
                user_code:
                  type: string
                  pattern: >-
                    ^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{3}-[BCDFGHJKLMNPQRSTVWXZ]{3}$
      responses:
        "200":
          description: Exact Browser-reviewable CLI login request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliLoginPreview"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/cli-logins/approve:
    post:
      operationId: approveCliLogin
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, user_code, space_id]
              properties:
                request_id:
                  type: string
                  format: uuid
                user_code:
                  type: string
                space_id:
                  type: string
                  format: uuid
                replacement_credential_id:
                  type: string
                  format: uuid
      responses:
        "204":
          description: >-
            Browser approval recorded without exposing a CLI credential
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /v1/cli-logins/deny:
    post:
      operationId: denyCliLogin
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, user_code]
              properties:
                request_id:
                  type: string
                  format: uuid
                user_code:
                  type: string
      responses:
        "204":
          description: CLI login explicitly denied
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/identity/cli-credentials:
    get:
      operationId: listCliCredentials
      security:
        - browserSession: []
      responses:
        "200":
          description: Active CLI credentials for the current User
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: "#/components/schemas/CliCredential"
        "401":
          $ref: "#/components/responses/Error"
  /v1/identity/cli-credentials/{credentialID}/revoke:
    parameters:
      - name: credentialID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revokeCliCredential
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Exact CLI credential revoked
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/cli-credentials/current/revoke:
    post:
      operationId: revokeCurrentCliCredential
      security:
        - memberCliCredential: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Current CLI credential revoked or exactly replayed
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/email/challenges:
    post:
      operationId: requestEmailCode
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, email]
              properties:
                challenge_id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        "202":
          description: Email submission accepted or its outcome remains unknown
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallenge"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/email/challenges/{challengeID}/verify:
    parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: verifyEmailCode
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "204":
          description: Browser session established or exactly replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/auth/google/start:
    post:
      operationId: startGoogleLogin
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                invitation_id:
                  type: string
                  format: uuid
      responses:
        "303":
          description: Redirect to the fixed Google authorization endpoint
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/google/callback:
    get:
      operationId: completeGoogleLogin
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthState"
        - $ref: "#/components/parameters/OAuthCode"
        - $ref: "#/components/parameters/OAuthError"
      responses:
        "303":
          description: >-
            Redirect to a fixed clean Carry URL after consuming the callback
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
  /v1/auth/github/start:
    post:
      operationId: startGitHubLogin
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                invitation_id:
                  type: string
                  format: uuid
      responses:
        "303":
          description: Redirect to the fixed GitHub authorization endpoint
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/github/callback:
    get:
      operationId: completeGitHubLogin
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthState"
        - $ref: "#/components/parameters/OAuthCode"
        - $ref: "#/components/parameters/OAuthError"
      responses:
        "303":
          description: >-
            Redirect to a fixed clean Carry URL after consuming the callback
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
  /v1/identity/methods:
    get:
      operationId: loadIdentityMethods
      security:
        - browserSession: []
      responses:
        "200":
          description: Fixed linked-method labels and recent-proof requirement
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityMethods"
        "401":
          $ref: "#/components/responses/Error"
  /v1/identity/reauthentication/email/challenges:
    post:
      operationId: requestEmailReauthenticationCode
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id]
              properties:
                challenge_id:
                  type: string
                  format: uuid
      responses:
        "202":
          description: Confirmation code submitted to the linked email method
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallenge"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/identity/reauthentication/email/challenges/{challengeID}/verify:
    parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: verifyEmailReauthenticationCode
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "204":
          description: >-
            Exact current method confirmed and Browser Session rotated
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/identity/reauthentication/google/start:
    post:
      operationId: startGoogleReauthentication
      security:
        - browserSession: []
      responses:
        "303":
          description: Redirect to Google for exact current-method confirmation
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/identity/reauthentication/github/start:
    post:
      operationId: startGitHubReauthentication
      security:
        - browserSession: []
      responses:
        "303":
          description: Redirect to GitHub for exact current-method confirmation
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/identity/methods/email/challenges:
    post:
      operationId: requestEmailLinkCode
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id, email]
              properties:
                challenge_id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        "202":
          description: Candidate email proof submitted
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChallenge"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/identity/methods/email/challenges/{challengeID}/verify:
    parameters:
      - name: challengeID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: verifyEmailLinkCode
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
      responses:
        "204":
          description: Email linked and all pre-change Sessions rotated
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/identity/methods/google/start:
    post:
      operationId: startGoogleLink
      security:
        - browserSession: []
      responses:
        "303":
          description: Redirect to Google to prove the candidate method
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/identity/methods/github/start:
    post:
      operationId: startGitHubLink
      security:
        - browserSession: []
      responses:
        "303":
          description: Redirect to GitHub to prove the candidate method
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/identity/methods/{method}:
    parameters:
      - name: method
        in: path
        required: true
        schema:
          type: string
          enum: [email, google, github]
    delete:
      operationId: unlinkIdentityMethod
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Method unlinked and all pre-change Sessions rotated
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/browser/sessions/current:
    delete:
      operationId: revokeCurrentBrowserSession
      security:
        - browserSession: []
      responses:
        "204":
          description: Browser session revoked
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: loadCurrentUser
      responses:
        "200":
          description: Current User and Spaces
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
  /v1/spaces:
    post:
      operationId: createSpace
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                suffix:
                  type: integer
                  minimum: 2
                  maximum: 9999
      responses:
        "201":
          description: >-
            Space and creator Membership created or exactly replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: Idempotency conflict or losing immutable Space URL
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceCreationConflict"
  /v1/machine-connections:
    post:
      operationId: beginMachineConnection
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  request_id,
                  display_name,
                  user_code,
                  poll_secret,
                  public_key,
                  key_proof,
                ]
              properties:
                request_id:
                  type: string
                  format: uuid
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 128
                user_code:
                  type: string
                poll_secret:
                  type: string
                public_key:
                  type: string
                  format: byte
                key_proof:
                  type: string
                  format: byte
      responses:
        "201":
          description: >-
            Short-lived Machine connection ceremony created or exactly replayed
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BegunMachineConnection"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/machine-connections/status:
    post:
      operationId: pollMachineConnection
      security: []
      parameters:
        - name: X-Carry-Machine-Connection
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exact approved Machine certificate
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedMachine"
        "202":
          description: Awaiting Browser decision
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/machine-connections/cancel:
    post:
      operationId: cancelMachineConnection
      security: []
      parameters:
        - name: X-Carry-Machine-Connection
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Connection request cancelled or exactly replayed
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /v1/machine-connections/lookup:
    post:
      operationId: lookupMachineConnection
      security:
        - browserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_code]
              properties:
                user_code:
                  type: string
      responses:
        "200":
          description: Exact pending Machine facts for Browser review
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineConnectionPreview"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/machine-connections/{requestID}/approve:
    parameters:
      - $ref: "#/components/parameters/MachineConnectionRequestID"
    post:
      operationId: approveMachineConnection
      security:
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, user_code, space_id]
              properties:
                request_id:
                  type: string
