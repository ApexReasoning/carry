---
openapi: 3.1.0
info:
  title: Carry Agent API
  version: v1
  description: >-
    Attempt-scoped context and terminal mutations. This protocol never accepts
    member or Machine credentials.
paths:
  /v1/agent/runs/{run_id}/attempts/{attempt_id}/context:
    get:
      operationId: loadAttemptContext
      security:
        - agentCredential: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/AttemptID"
        - name: fence
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Immutable context fixed for the current Attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/agent/runs/{run_id}/attempts/{attempt_id}/revision:
    post:
      operationId: commitWorkUnderstanding
      security:
        - agentCredential: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/AttemptID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRevision"
      responses:
        "200":
          description: The current fenced revision was committed.
        "400":
          $ref: "#/components/responses/InvalidCommand"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/agent/runs/{run_id}/attempts/{attempt_id}/outcome:
    post:
      operationId: finishAttemptOutcome
      security:
        - agentCredential: []
      parameters:
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/AttemptID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishOutcome"
      responses:
        "200":
          description: The unresolved terminal outcome was recorded.
        "400":
          $ref: "#/components/responses/InvalidCommand"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    agentCredential:
      type: http
      scheme: bearer
      description: >-
        Opaque short-lived credential bound to one exact Run Attempt and fence.
  parameters:
    RunID:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptID:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: >-
        The Agent credential is missing, mixed with another principal, expired,
        or stale.
    InvalidCommand:
      description: >-
        The command is malformed or outside the narrow Attempt contract.
  schemas:
    Input:
      type: object
      additionalProperties: false
      required: [sequence, kind, text]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [goal, message]
        author_user_id:
          type: string
          format: uuid
        text:
          type: string
    AttemptContext:
      type: object
      additionalProperties: false
      required:
        - run_id
        - attempt_id
        - work_id
        - space_id
        - goal
        - current_understanding
        - current_next_step
        - input_start_seq
        - input_end_seq
        - base_revision
        - fence
        - inputs
      properties:
        run_id:
          type: string
          format: uuid
        attempt_id:
          type: string
          format: uuid
        work_id:
          type: string
          format: uuid
        space_id:
          type: string
          format: uuid
        goal:
          type: string
        current_understanding:
          type: string
        current_next_step:
          type: string
        input_start_seq:
          type: integer
          format: int64
          minimum: 1
        input_end_seq:
          type: integer
          format: int64
          minimum: 1
        base_revision:
          type: integer
          format: int64
          minimum: 0
        fence:
          type: integer
          format: int64
          minimum: 1
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/Input"
    CommitRevision:
      type: object
      additionalProperties: false
      required:
        - fence
        - writer_token
        - base_revision
        - input_end_seq
        - understanding
        - next_step
      properties:
        fence:
          type: integer
          format: int64
          minimum: 1
        writer_token:
          type: string
          format: uuid
        base_revision:
          type: integer
          format: int64
          minimum: 0
        input_end_seq:
          type: integer
          format: int64
          minimum: 1
        understanding:
          type: string
          minLength: 1
          maxLength: 61440
        next_step:
          type: string
          minLength: 1
          maxLength: 8192
    FinishOutcome:
      type: object
      additionalProperties: false
      required: [fence, writer_token, outcome]
      properties:
        fence:
          type: integer
          format: int64
          minimum: 1
        writer_token:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [failed, unknown]
